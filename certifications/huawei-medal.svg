<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE066"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="ribbonLeft" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#991B1B"/>
    </linearGradient>
    <linearGradient id="ribbonRight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="medalShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Ribbons behind the medal -->
  <polygon points="46,65 30,110 48,100 58,110 56,65" fill="url(#ribbonLeft)" />
  <polygon points="74,65 62,110 72,100 90,110 64,65" fill="url(#ribbonRight)" />

  <!-- Laurel wreath wreath circle -->
  <circle cx="60" cy="50" r="38" fill="none" stroke="#D97706" stroke-width="2" stroke-dasharray="4,3" opacity="0.6"/>

  <!-- Outer gold medal ring -->
  <circle cx="60" cy="50" r="36" fill="url(#goldGrad)" filter="url(#medalShadow)"/>

  <!-- Inner medal face -->
  <circle cx="60" cy="50" r="29" fill="url(#innerGrad)"/>
  <circle cx="60" cy="50" r="26" fill="none" stroke="#FDE68A" stroke-width="1.5" stroke-dasharray="3,2"/>

  <!-- Star in center -->
  <path d="M60 36 L63 45 L72 45 L65 51 L68 60 L60 55 L52 60 L55 51 L48 45 L57 45 Z" fill="#FFFFFF" opacity="0.9"/>
</svg>
